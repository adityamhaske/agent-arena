# Example project 3 — compare models running on your own machine.
#
# Two ways to run it:
#
#   A. With the stand-in server (no model download needed):
#        python demo/fake_local_server.py --port 11434
#        arena evaluate --project projects/local_demo
#
#   B. With real Ollama models:
#        ollama serve
#        ollama pull llama3.2 && ollama pull qwen2.5:7b
#        arena evaluate --project projects/local_demo -p ... --models llama32 qwen25
#      (uncomment the two entries at the bottom of `models:` first)
#
# Nothing about the arena changes between A and B — same connector, same HTTP
# call. The stand-in just answers faster and costs no disk.

project: local_demo
description: >
  Route support tickets using models hosted on this machine. Local inference is
  free per call, so the decision is accuracy against latency — and whether a
  small model is good enough to avoid sending customer data off the box at all.

models:
  # Real Ollama models running locally
  - key: llama32
    model: llama3.2
    label: "Llama 3.2 (Ollama)"

  - key: qwen25
    model: qwen2.5:7b
    label: "Qwen 2.5 7B (Ollama)"

defaults:
  system: >
    You are a support ticket router. Reply with exactly one queue name from:
    billing, technical, account, shipping, refund, spam. No other words, no
    punctuation, no explanation.
  max_tokens: 10
  temperature: 0

run:
  trials: 2
  concurrency: 4     # local servers are usually single-GPU; keep this modest
  timeout_s: 120     # first call after a model load can be slow
  retries: 1

metrics:
  weights:
    accuracy: 0.60
    latency: 0.30
    cost: 0.10       # local inference is $0/call, so this mostly rewards staying local
  latency:
    target_ms: 2000
  cost:
    budget_usd_per_1k_calls: 1.0

constraints:
  min_accuracy: 0.60

scorers:
  default: classification
  options:
    classification:
      labels: [billing, technical, account, shipping, refund, spam]

output:
  dir: results
  formats: [markdown, json]
