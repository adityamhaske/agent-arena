name: Docs site

on:
  push:
    branches: [main]
    # The site is rendered from the repo's own markdown, so a doc edit has to
    # redeploy it. Anything that changes what a page says belongs here.
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "demo.md"
      - "studies/multi_agent_handoff/README.md"
      - "studies/multi_agent_handoff/docs/**"
      - "studies/multi_agent_handoff/results/**/report.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      # Job-scoped so every step agrees on it. Project pages are served from
      # /<repo>/, and deriving it from the repo name keeps a fork working.
      SITE_BASE: /${{ github.event.repository.name }}
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # Tries to turn Pages on so nobody has to visit Settings first. The
      # default token often lacks permission to create a Pages site ("Resource
      # not accessible by integration"), and that is not a reason to fail the
      # build: the docs still compile and the link check still protects the
      # push. Deployment is gated on this succeeding instead.
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: pip install -r site/requirements.txt

      - name: Build
        run: python site/build.py

      - name: Check for broken internal links
        run: python site/check_links.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    name: deploy
    # A pull request gets the build and the link check, but must never publish.
    # `pages_ready` is false until someone enables Pages once under
    # Settings → Pages → Source: GitHub Actions; until then this is skipped
    # rather than failed, so a red X never hides a healthy docs build.
    if: |
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
