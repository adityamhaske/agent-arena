<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agent Arena</title>
<!-- No webfont: the app serves a strict CSP (style-src 'self') that would
     block one, and a tool that runs on your own machine has no business
     making a request to a font CDN. Every stack in app.css falls back to
     the platform UI font, which is what you actually see. -->
<link rel="stylesheet" href="/app.css?v=__ARENA_VERSION__">
<!-- The documentation site's mark, so the app and the docs read as one product. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='4' width='24' height='24' fill='none' stroke='%23ec7211' stroke-width='3'/><rect x='19' y='9' width='5' height='5' fill='%23ec7211'/></svg>">
</head>
<body>

<a class="skip-link" href="#app">Skip to content</a>

<div class="shell">

  <aside class="sidenav" id="sidenav">
    <a class="brand" href="#/" data-link>
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="4" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="19" y="9" width="5" height="5" fill="currentColor"/>
      </svg>
      <span>Agent Arena</span>
    </a>

    <div class="nav-action" id="nav-action">
      <a href="#/new" data-link class="btn btn-primary btn-nav-action">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New evaluation</span>
      </a>
    </div>

    <nav class="nav" id="nav" aria-label="Sections"><!-- rendered by app.js --></nav>

    <div class="nav-foot">
      <div id="run-pill" class="run-pill" hidden></div>
      <div class="nav-foot-row">
        <nav class="nav nav-foot-nav" id="nav-foot-links" aria-label="Configuration"><!-- rendered by app.js --></nav>
        <span class="nav-foot-divider" aria-hidden="true">|</span>
        <button class="icon-btn theme-toggle-btn" type="button" id="theme-toggle" aria-label="Switch between light and dark" title="Toggle theme"></button>
      </div>
    </div>
  </aside>

  <div class="pane">
    <button class="icon-btn mobile-nav-toggle" type="button" id="nav-toggle"
            aria-expanded="false" aria-controls="sidenav" aria-label="Toggle navigation" title="Menu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <main id="app" aria-live="polite">
      <div class="loading">Loading…</div>
    </main>
  </div>

</div>

<div id="toast" class="toast" role="status" hidden></div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="btn-row" id="modal-actions"></div>
  </div>
</div>

<script src="/app.js?v=__ARENA_VERSION__"></script>
</body>
</html>
